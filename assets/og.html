<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- OG source of truth: 1200x630. Render: screenshot #og to assets/og.png, copied to dist/og.png by build.py -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; margin: 0; background: #fef6e4; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #og { width: 1200px; height: 630px; background: #fef6e4; color: #001858; padding: 72px 80px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  #og::after { content: ""; position: absolute; right: -140px; top: -140px; width: 420px; height: 420px; border-radius: 50%; background: #8bd3dd; opacity: .35; }
  #og::before { content: ""; position: absolute; right: 120px; bottom: -180px; width: 300px; height: 300px; border-radius: 50%; background: #f582ae; opacity: .30; }
  .kicker { font-size: 28px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #001858; }
  .kicker span { display: inline-block; background: #001858; color: #fef6e4; padding: 6px 16px; border-radius: 999px; letter-spacing: .12em; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; margin: 22px 0 18px; max-width: 960px; }
  .counts { display: flex; gap: 16px; align-items: center; margin: 6px 0 20px; }
  .pill { font-size: 36px; font-weight: 800; background: #f582ae; color: #001858; padding: 10px 26px; border-radius: 999px; }
  .pill.teal { background: #8bd3dd; }
  .sub { font-size: 30px; color: #001858; opacity: .85; max-width: 900px; }
  .foot { margin-top: 28px; font-size: 26px; font-weight: 600; color: #001858; opacity: .75; }
</style>
</head>
<body>
<main id="og">
  <p class="kicker"><span>freeinference.dev</span></p>
  <h1>Free LLM API Directory</h1>
  <div class="counts">
    <span class="pill">110 Models</span>
    <span class="pill teal">36 Providers</span>
  </div>
  <p class="sub">An API key, a CLI login, or bundled inference. $0 — no card.</p>
  <p class="foot">Updated 01 Oct 2026</p>
</main>
</body>
</html>
