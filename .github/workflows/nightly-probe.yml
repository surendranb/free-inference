name: nightly-probe

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"   # 09:07 IST

jobs:
  probe-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Run FreeInference 3-Route Engine (Scout and Verify)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_OTLP_ENDPOINT: ${{ secrets.ARIZE_OTLP_ENDPOINT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: "C0BLW648J3T"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m core.runner --verify --all --apply --skip-rebuild
      - name: Generate Weekly Dispatch (Mondays)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "$(date +%u)" -eq 1 ]; then
            python3 scripts/generate_newsletter.py
          fi
      - name: Build site (regenerates README.md + dist/)
        run: python3 build.py
      - name: Verify programmatic matrix
        run: python3 scripts/verify_matrix.py
      - name: Commit changes if any
        # push to main auto-triggers the Cloudflare Pages build (build.py -> dist/)
        run: |
          git config user.name "free-inference-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/providers.json data/run_summary.json data/candidates.json README.md data/newsletters/ skills/; then
            git add data/providers.json data/run_summary.json data/candidates.json README.md data/newsletters/ skills/
            git commit -m "probe: nightly verification & scout update ($(date -u +%Y-%m-%d))"
            git push
          fi
      - name: Trigger Cloudflare Pages rebuild
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl -sf -X POST "$CLOUDFLARE_DEPLOY_HOOK"
          else
            echo "no deploy hook configured; git push above is the deploy trigger"
          fi
      - name: "Alert on Failure (Slack and GitHub Issue)"
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: python3 scripts/alert_failure.py
